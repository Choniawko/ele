name: ELE Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Choniawko/ele'
    uses: ./.github/workflows/verify.yml
    with:
      release_tag: ${{ github.ref_name }}
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write # immutable version archive in GitHub Releases
      pages: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download the archive produced by the successful verification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ele-release-${{ github.sha }}
          path: release
      - name: Verify archive and preserve release without overwriting older assets
        shell: bash
        run: |
          cd release
          sha256sum -c "ele-$TAG.tar.gz.sha256"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'This release already exists. Use ELE Rollback on its protected tag; do not overwrite its archive.' >&2
            exit 1
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "ELE $TAG" --notes 'Verified /ele/ dist; archive, SHA-256, version.json and asset manifest attached. See docs/RELEASING.md for rollback and scope.' \
            "ele-$TAG.tar.gz" "ele-$TAG.tar.gz.sha256" version.json asset-manifest.json
      - name: Deploy the Pages artifact from the same successful verification
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
